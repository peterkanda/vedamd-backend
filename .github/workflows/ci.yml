name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build / typecheck / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      # Unit tests only — integration specs skip themselves when
      # DATABASE_URL is absent.
      - run: npm test -- --run
      # OpenAPI snapshot drift gate. Fails the PR if docs/openapi.json
      # is out of date with the live API surface.
      - run: npm run openapi:check

  bundle-verify:
    name: content bundle — signature + governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - name: verify bundle (signature + structure)
        run: npm run bundle:verify -- --bundle content/bundles/v0.1.0
      - name: citation-strength gate (every ref must carry an A-D tier)
        # We allow all source types — including consumer / wiki at tier
        # D — but every reference MUST be scored so the UI can render a
        # source-quality badge. Run scripts/score-citation-sources.js
        # to auto-fill before opening a PR.
        run: npm run bundle:check-strength
      - name: require approved-only content (main branch)
        if: github.ref == 'refs/heads/main'
        run: npm run bundle:verify -- --bundle content/bundles/v0.1.0 --require-approved
        continue-on-error: true # v0.1 is still draft; flip to false once content is promoted.

  integration-tests:
    name: Drizzle / Postgres integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vedamd_ci
          POSTGRES_USER: vedamd
          POSTGRES_PASSWORD: vedamd_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vedamd -d vedamd_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vedamd:vedamd_ci_password@localhost:5432/vedamd_ci
      DATABASE_SSL: 'false'
      API_KEY_FINGERPRINT_SECRET: ci-only-fp
      AUDIT_HASH_SECRET: ci-only-hmac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - name: apply migrations
        run: npm run db:migrate
      # The same suite runs as in `build` above — but with DATABASE_URL
      # set, the .integration.spec.ts files unskip and exercise the
      # real Drizzle code paths against the migrated schema.
      - name: run full test suite (unit + integration)
        run: npm test -- --run
