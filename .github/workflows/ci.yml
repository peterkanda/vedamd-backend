name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build / typecheck / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      # Lint as a gate, not a fixer: `npm run lint` passes --fix, which would
      # silently rewrite files in CI and pass regardless.
      - name: lint
        run: npx eslint "{src,test}/**/*.ts" --max-warnings=0
      # The stateless / PHI-free-logger invariants (NFR-027-029): no console in
      # src, no raw pino, no patient tables. Defence-in-depth over ESLint.
      - run: npm run audit:stateless
      - run: npm run bundle:check-licence
      - run: node scripts/check-clinical-safety.js --strict
      - run: node scripts/check-citation-links.js --strict
      # Overlay invariants: jurisdiction tagging, graded citations, and above
      # all the no-self-approval rule that keeps draft content out of the
      # approved tier.
      - run: npm run overlays:validate
      # Unit tests only — integration specs skip themselves when
      # DATABASE_URL is absent.
      - run: npm test -- --run
      # OpenAPI snapshot drift gate. Fails the PR if docs/openapi.json
      # is out of date with the live API surface.
      - run: npm run openapi:check

  secret-scan:
    # This repository is public. An OpenAI key was committed to .env.example
    # in May 2026 and sat in history until it was found in a review; this job
    # fails any push or PR that adds a key, token or private key anywhere in
    # history. Exceptions live in .gitleaks.toml, each with its reason.
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: install gitleaks (pinned + checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: scan full history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose .

  bundle-verify:
    name: content bundle — signature + governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - name: verify bundle (signature + structure)
        run: npm run bundle:verify -- --bundle content/bundles/v0.1.0
      - name: citation-strength gate (every ref must carry an A-D tier)
        # We allow all source types — including consumer / wiki at tier
        # D — but every reference MUST be scored so the UI can render a
        # source-quality badge. Run scripts/score-citation-sources.js
        # to auto-fill before opening a PR.
        run: npm run bundle:check-strength
      # Approval ratchet — this one actually fails the build.
      #
      # The step below it (--require-approved) is the end state we want, but it
      # cannot be enforced yet: the v0.1 bundle is entirely draft, so turning it
      # on would block every release. It was therefore left as
      # continue-on-error AND scoped to main, meaning it never blocked anything
      # and never ran on a pull request — a gate in name only.
      #
      # The ratchet holds the line in the meantime: the existing backlog is
      # tolerated, but a PR cannot ADD unapproved clinical content. See
      # MAX_UNAPPROVED in scripts/promote-bundle.ts.
      - name: content approval ratchet (backlog must not grow)
        run: npm run bundle:promote -- --check

      - name: approval backlog report
        run: npm run bundle:promote -- --status

      # The end state. Still advisory, and now it runs on pull requests too so
      # the remaining backlog is visible on every change rather than only on
      # main. Drop continue-on-error once the ratchet above reaches 0.
      - name: require approved-only content (advisory until the backlog clears)
        run: npm run bundle:verify -- --bundle content/bundles/v0.1.0 --require-approved
        continue-on-error: true

  integration-tests:
    name: Drizzle / Postgres integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vedamd_ci
          POSTGRES_USER: vedamd
          POSTGRES_PASSWORD: vedamd_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vedamd -d vedamd_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vedamd:vedamd_ci_password@localhost:5432/vedamd_ci
      DATABASE_SSL: 'false'
      API_KEY_FINGERPRINT_SECRET: ci-only-fp
      AUDIT_HASH_SECRET: ci-only-hmac
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - name: apply migrations
        run: npm run db:migrate
      # The same suite runs as in `build` above — but with DATABASE_URL
      # set, the .integration.spec.ts files unskip and exercise the
      # real Drizzle code paths against the migrated schema.
      #
      # --no-file-parallelism because the DB-backed specs share one database
      # and truncate tables between cases: run in parallel they race each
      # other and fail intermittently (reproduced locally against a real
      # Postgres — 3 of 26 failed in parallel, all 26 passed sequentially).
      - name: run full test suite (unit + integration)
        run: npm test -- --run --no-file-parallelism
