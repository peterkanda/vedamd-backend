name: medgemma content validation

# Automated medical second-opinion over the authored overlay content.
# Manual trigger only. The nightly schedule was removed 2026-09-11 because the
# run was failing every night. Confirmed locally (2026-09-12): `npm run
# validate:medgemma:ci` exits 0 and skips cleanly when no reviewer secret is
# configured — so a genuinely unconfigured reviewer would show green nightly
# runs, not failures. That rules out "no secret configured" as the cause. If a
# reviewer secret WAS configured for the nightly runs, the remaining
# possibilities are: (a) the gate working as designed (a record was flagged
# 'error' — check the uploaded medgemma-review artifact, not a bug) or (b) the
# reviewer call itself erroring (API quota/rate-limit/outage at the configured
# endpoint). Neither can be distinguished without the actual run logs from
# when the cron was live — check those, or trigger a manual run with the
# secrets configured, before re-adding a schedule.
# It is a SCREEN, not approval: it fails the run
# only when MedGemma flags a likely ERROR. It SKIPS cleanly (no failure) when no
# MedGemma endpoint is configured, so it is safe to enable before the endpoint
# exists — set the repo secrets below to turn it on.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: MedGemma review of country overlays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - name: Validate overlays against MedGemma (fails on 'error' verdicts)
        env:
          # Reviewer is whichever is configured. Simplest: set ANTHROPIC_API_KEY
          # to use Claude (no GPU to host). Or point the MEDGEMMA_* secrets at a
          # self-hosted MedGemma endpoint. When NEITHER is set the step skips
          # cleanly, so this is safe to enable before any endpoint exists.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.MEDGEMMA_API_KEY }}
          AGENTIC_OPENROUTER_BASE_URL: ${{ secrets.MEDGEMMA_BASE_URL }}
          AGENTIC_OPENROUTER_MODEL: ${{ secrets.MEDGEMMA_MODEL }}
        run: npm run validate:medgemma:ci
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medgemma-review
          path: content/validation/medgemma-review.*
          if-no-files-found: ignore
