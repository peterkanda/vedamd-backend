services:
  postgres:
    image: postgres:16-alpine
    container_name: vedamd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vedamd_dev
      POSTGRES_USER: vedamd
      POSTGRES_PASSWORD: vedamd_dev_password
    ports:
      - '5432:5432'
    volumes:
      - vedamd-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vedamd -d vedamd_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vedamd-postgres-data:
